<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}" href="/css/bootstrap-icons.min.css">

<body>
<h1>Timeline</h1>
<div id="root">
    <div id="message"></div>
    <button type="button" class="btn btn-primary" onclick="get()">Get</button>

</div>
<script>
function get(){
    const response = axios.get("http://localhost:99/api/timeline");
    const message = document.getElementById('message');
    alert(response.status)
    alert(response.data)
    message.innerText = response.data;
}
</script>
