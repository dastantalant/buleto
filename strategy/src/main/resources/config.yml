config:
  # ==============================================================================
  # 🟢 БАЗОВЫЙ КОНФИГ
  # ==============================================================================
  - name: Default
    # Тип рулетки: Американская (0 и 00) — сложнее выигрывать, преимущество казино 5.26%
    type: AMERICAN
    # Стандартный баланс
    balance: 15000
    # Диапазон ставок. 1 к 15000 — широкий диапазон, удобен для прогрессий
    minBet: 1
    maxBet: 15000
    limit: 15000
    # Условия остановки по умолчанию
    stopLossPercentage: 50      # Стоп, если слили 50% баланса
    takeProfitPercentage: 20    # Стоп, если заработали 20% сверху
    trailingStopPercentage: 0   # Отключено
    maxDrawdownPercentage: 0    # Отключено
    maxWinStreak: 0             # Отключено
    maxLossStreak: 0            # Отключено
    maxRounds: 0                # Бесконечная игра (пока есть деньги)
    maxBetBalancePercentage: 0  # Нет лимита на размер ставки от банка
    stagnationWindow: 0         # Нет проверки на застой
    minWinRateThreshold: 0      # Нет проверки винрейта
    minRoundsForWinRate: 0

  # ==============================================================================
  # 🟠 СУЩЕСТВУЮЩИЕ ПРОФИЛИ (КЛАССИКА)
  # ==============================================================================
  - name: Standard
    # Обычный игрок с небольшим депозитом ($1000)
    # Проверка: Как стратегия работает в "домашних" условиях
    balance: 1000
    maxBet: 500

  - name: VegasHighRoller
    # VIP-игрок ("Кит"). Огромный баланс и лимиты.
    # Проверка: Стратегии, требующие глубокого запаса прочности
    balance: 100000
    minBet: 10
    maxBet: 15000
    limit: 15000
    stopLossPercentage: 70      # Готов рискнуть 70% денег
    takeProfitPercentage: 50    # Хочет сорвать куш

  - name: LowBudgetGrinder
    # Игрок с последней сотней в кармане. Очень жесткие условия.
    # Проверка: Выживаемость стратегии при малом запасе ходов.
    balance: 100
    maxBet: 50
    limit: 1000
    stopLossPercentage: 20      # Очень пугливый стоп-лосс
    takeProfitPercentage: 5     # Маленькая цель (на пиво)
    maxLossStreak: 3            # Стоп, если проиграл 3 раза подряд (психологический лимит)

  - name: InfiniteMartingaleTest
    # "Бог Рулетки". Бесконечные деньги и лимиты.
    # Проверка: Математическая проверка Мартингейла (должен всегда выигрывать в теории)
    balance: 1000000000
    maxBet: 1000000000
    limit: 1000000000
    stopLossPercentage: 0       # Без стопов
    takeProfitPercentage: 0
    maxRounds: 100000           # Долгая дистанция

  - name: StabilityTest
    # Тест на стабильность графика доходности.
    # Проверка: Отсеивание стратегий с "американскими горками" (дикой волатильностью).
    balance: 10000
    maxBet: 5000
    limit: 20000
    stopLossPercentage: 0
    takeProfitPercentage: 0
    maxDrawdownPercentage: 30   # СТОП, если просадка от пика достигла 30%. Жесткий риск-менеджмент.

  - name: HitAndRun
    # Стратегия "Ударил и убежал".
    # Проверка: Агрессивные стратегии, рассчитанные на короткую удачу.
    balance: 2000
    minBet: 5
    maxBet: 500
    limit: 5000
    stopLossPercentage: 10      # Быстрый выход при убытке
    takeProfitPercentage: 10    # Быстрый выход при прибыли

  - name: TrendSurfer
    # Ловля трендов с плавающим стопом.
    # Проверка: Работа TrailingStop. Даем прибыли расти, но фиксируем, если тренд развернулся.
    balance: 5000
    minBet: 5
    maxBet: 5000
    limit: 10000
    stopLossPercentage: 30
    takeProfitPercentage: 0     # Нет тейка, хотим максимум
    trailingStopPercentage: 20  # Если баланс упал на 20% от максимального за сессию — ВЫХОД.

  - name: SafetyFirst
    # Консервативная игра.
    # Проверка: Защита от "тильта" (серии поражений).
    balance: 5000
    minBet: 5
    maxBet: 2000
    limit: 10000
    stopLossPercentage: 20
    takeProfitPercentage: 0
    maxLossStreak: 4            # Если 4 проигрыша подряд — остановить бота.

  # ==============================================================================
  # 🔵 ТИПЫ РУЛЕТКИ (ЕВРОПА)
  # ==============================================================================
  - name: EuropeanStandard
    # Европейская рулетка (один 0).
    # Проверка: Сравнение доходности с American (тут преимущество казино всего 2.7%).
    type: EUROPEAN
    balance: 10000
    minBet: 1
    stopLossPercentage: 50
    takeProfitPercentage: 20

  - name: EuropeanPro
    # Профессиональная игра на Европе с высоким лимитом.
    # Проверка: Долгая игра "до последнего" (StopLoss 100%).
    type: EUROPEAN
    balance: 50000
    minBet: 5
    maxBet: 5000
    limit: 50000
    stopLossPercentage: 100     # Играем на все
    takeProfitPercentage: 10

  # ==============================================================================
  # 🟣 СПЕЦИФИЧЕСКИЕ СЦЕНАРИИ (СТРЕСС-ТЕСТЫ)
  # ==============================================================================
  - name: MartingaleParadise
    # "Рай для Мартингейла".
    # Для чего: Специально подобранный баланс (2^16 - 1) и лимиты для идеального удвоения.
    type: EUROPEAN
    balance: 65535              # Хватит ровно на 16 удвоений с 1$
    minBet: 1
    maxBet: 100000
    limit: 100000
    stopLossPercentage: 90
    takeProfitPercentage: 5

  - name: TableLimitTrap
    # "Ловушка лимитов стола".
    # Проверка: Как поведет себя стратегия, когда Макс.Ставка очень близка к Мин.Ставке.
    # Это убивает любой Мартингейл на 3-м шаге.
    balance: 10000
    minBet: 100
    maxBet: 500                 # Всего 5 минимальных ставок
    limit: 500
    stopLossPercentage: 50
    takeProfitPercentage: 50

  - name: ConservativeGrowth
    # "Инвестор".
    # Проверка: Флэт-беттинг и критерий Келли. Долгая нудная игра с защитой капитала.
    balance: 5000
    minBet: 5
    stopLossPercentage: 0       # Обычный стоп отключен
    maxDrawdownPercentage: 15   # Главное — не просесть глубоко
    takeProfitPercentage: 0
    trailingStopPercentage: 5   # Фиксируем любую значимую прибыль

  # ==============================================================================
  # 🟡 ТЕСТЫ УСЛОВИЙ ОСТАНОВКИ (ТЕХНИЧЕСКИЕ)
  # ==============================================================================
  - name: TrailingStopTest
    # Чистый тест Трейлинг-стопа.
    # Сценарий: Баланс вырос до 12000, потом упал до 10800 (10% отката) -> СТОП.
    balance: 10000
    stopLossPercentage: 50
    takeProfitPercentage: 0
    trailingStopPercentage: 10

  - name: AntiStagnation
    # Защита от "болота".
    # Проверка: Если стратегия делает ставки (Red+Black), теряет на зеро, но баланс почти не меняется.
    balance: 2000
    stagnationWindow: 50        # Если за 50 раундов баланс не изменился — ВЫХОД.
    maxRounds: 500

  - name: QualityControl
    # Контроль качества прогнозов.
    # Проверка: Если предиктор (AI/Markov) не угадывает — выключаем его, не тратим деньги.
    balance: 10000
    minRoundsForWinRate: 100    # Даем 100 раундов на разгон
    minWinRateThreshold: 0.45   # Если винрейт ниже 45% (на красное/черное) — стратегия мусор, СТОП.
    type: EUROPEAN

  - name: RiskManager
    # Защита от All-in.
    # Проверка: Блокировка стратегий, которые хотят поставить пол-банка за раз.
    balance: 5000
    maxBetBalancePercentage: 10.0 # Нельзя ставить больше 10% от текущего баланса в одном раунде.
    stopLossPercentage: 100

  # ==============================================================================
  # ⏱️ ДЛИТЕЛЬНОСТЬ СЕССИЙ
  # ==============================================================================
  - name: Scalper
    # Скальпинг (сверхкороткая сессия).
    # Задача: Забрать 2% прибыли за 50 раундов или уйти.
    balance: 10000
    minBet: 100
    maxBet: 5000
    takeProfitPercentage: 2
    stopLossPercentage: 10
    maxRounds: 50

  - name: Marathon
    # Марафон (10,000 спинов).
    # Задача: Проверка на дистанции. Выживет ли стратегия против матожидания казино?
    balance: 50000
    minBet: 1
    stopLossPercentage: 100
    takeProfitPercentage: 0
    maxRounds: 10000
    stagnationWindow: 0

  # ==============================================================================
  # 🔥 ЭКСТРЕМАЛЬНЫЕ УСЛОВИЯ
  # ==============================================================================
  - name: MicroStakes
    # Микро-лимиты.
    # Проверка: Ошибки округления и логика работы с мелкими целыми числами.
    balance: 50
    minBet: 1
    maxBet: 5
    limit: 10
    stopLossPercentage: 50
    takeProfitPercentage: 100

  - name: WinStreakSniper
    # Снайпер победной серии.
    # Задача: Поймать ровно 3 победы подряд и сразу выйти. Идеально для Парлай/Пароли.
    balance: 1000
    minBet: 100
    maxWinStreak: 3             # СТОП после 3 побед подряд
    stopLossPercentage: 50

  - name: BadRunProtector
    # Защита от черной полосы.
    # Задача: Если не везет (5 лосей подряд) — лучше прийти завтра.
    balance: 5000
    maxLossStreak: 5            # СТОП после 5 поражений подряд
    stopLossPercentage: 30